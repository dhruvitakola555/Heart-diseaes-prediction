<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Heart Disease Prediction Form</title> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" crossorigin="anonymous" referrerpolicy="no-referrer" /> 
    <link rel="stylesheet" href="h.css"> 
</head> 
<body> 
    <div class="from-card"> 
        <header> 
            <h1><i class="fa fa-heartbeat" style="color: white;"></i> HEART DISEASE PREDICTION FORM</h1> 
            <p>Please fill in the patient data for prediction.</p> 
        </header> 

        <div class="info"> 
            <h2><i class="fa-solid fa-user" style="color: red;"></i> Patient Information</h2> 
        </div> 

        <form id="predictionForm">
            <div class="input"> 
                <div class="age"> 
                    <label>Age(in years)</label><br> 
                    <i class="fa-solid fa-calendar-days" style="color: rgb(242, 25, 2);"></i> 
                    <input type="number" placeholder="Enter Age" required> 
                </div> 

                <div class="gender"> 
                    <label>Gender</label><br> 
                    <i class="fa-solid fa-user" style="color: red;"></i> 
                    <select required> 
                        <option value="" disabled selected>Select Option</option> 
                        <option value="0">Male</option> 
                        <option value="1">Female</option> 
                        <option value="2">Other</option> 
                    </select> 
                </div> 

                <div class="chest-pain"> 
                    <label>Chest Pain Type</label><br> 
                    <i class="fa fa-heartbeat" style="color: red;"></i> 
                    <select required> 
                        <option value="" disabled selected>Select Option</option> 
                        <option value="0">Typical Angina</option> 
                        <option value="1">Atypical Angina</option> 
                        <option value="2">Non-anginal Pain</option> 
                        <option value="3">Asymptomatic</option> 
                    </select> 
                </div> 

                <div class="blood"> 
                    <label>Resting Blood Pressure (mm Hg)</label><br> 
                    <i class="fa-solid fa-droplet" style="color: red;"></i> 
                    <input type="number" placeholder="Enter Resting Blood Pressure" required> 
                </div> 

                <div class="serum"> 
                    <label>Serum Cholesterol (mg/dl)</label><br> 
                    <i class="fa-solid fa-droplet" style="color: red;"></i> 
                    <input type="number" placeholder="Enter Cholesterol Level" required> 
                </div> 

                <div class="blood-suger"> 
                    <label>Fasting Blood Sugar > 120 mg/dl</label><br>  
                    <i class="fa-solid fa-droplet" style="color: red;"></i> 
                    <select required> 
                        <option value="" disabled selected>Select Option</option> 
                        <option value="1">True</option> 
                        <option value="0">False</option> 
                    </select> 
                </div> 

                <div class="ecg"> 
                    <label>Resting ECG Results</label><br> 
                    <i class="fa fa-heartbeat" style="color: red;"></i> 
                    <select required> 
                        <option value="" disabled selected>Select ECG Result</option> 
                        <option value="0">Normal</option> 
                        <option value="1">ST-T Wave Abnormality</option> 
                        <option value="2">Left Ventricular Hypertrophy</option> 
                    </select> 
                </div> 

                <div class="max"> 
                    <label>Max Heart Rate Achieved</label><br> 
                    <i class="fa-solid fa-heart" style="color: rgb(242, 25, 2);"></i> 
                    <input type="number" placeholder="Enter your Max Heart Rate" required> 
                </div> 

                <div class="exrcise"> 
                    <label>Exercise Induced Angina</label><br> 
                    <i class="fa-solid fa-heart" style="color: rgb(242, 25, 2);"></i> 
                    <select required> 
                        <option value="" disabled selected>Select Option</option> 
                        <option value="1">Yes</option> 
                        <option value="0">No</option> 
                    </select> 
                </div> 

                <div class="st"> 
                    <label>ST Depression Induced by Exercise</label><br> 
                    <i class="fa fa-heartbeat" style="color: red;"></i> 
                    <input type="number" step="0.1" placeholder="Enter oldpeak value" required> 
                </div> 

                <div class="slopest"> 
                    <label>Slope of Peak Exercise ST Segment</label><br> 
                    <i class="fa-solid fa-chart-line" style="color: rgb(242, 25, 2);"></i> 
                    <select required> 
                        <option value="" disabled selected>Select Slope</option> 
                        <option value="0">Upsloping</option> 
                        <option value="1">Flat</option> 
                        <option value="2">Downsloping</option> 
                    </select> 
                </div> 

                <div class="number"> 
                    <label>Number of Major Vessels Colored (0-3)</label><br> 
                    <i class="fa-solid fa-lungs" style="color: red;"></i> 
                    <select required> 
                        <option value="" disabled selected>Select Vessels</option> 
                        <option value="0">0</option> 
                        <option value="1">1</option> 
                        <option value="2">2</option> 
                        <option value="3">3</option> 
                    </select> 
                </div> 

                <div class="thala"> 
                    <label>Thalassemia</label><br> 
                    <i class="fas fa-tint" style="color: #d93838;"></i> 
                    <select required> 
                        <option value="" disabled selected>Select Thalassemia</option> 
                        <option value="1">Normal</option> 
                        <option value="2">Fixed Defect</option> 
                        <option value="3">Reversible Defect</option> 
                    </select> 
                </div> 
            </div> 

            <div class="sr"> 
                <div class="submit-section"> 
                    <button type="submit" class="submit-btn"><i class="fa fa-heartbeat" style="color: white;"></i> SUBMIT FOR PREDICTION</button> 
                </div> 
                <div class="reset"> 
                    <button type="reset" class="reset-btn"><i class="fa-solid fa-rotate-right" style="color: rgb(242, 25, 2);"></i> RESET</button> 
                </div> 
            </div> 
        </form>
    </div> 
    <div id="resultModal" class="modal">
        <div class="modal-content">
            <div id="riskIcon" class="icon-box"></div>
            <h2 id="modalTitle">Prediction Result</h2>
            <p id="modalDescription"></p>
            <button class="close-btn" onclick="closeModal()">Close</button>
        </div>
    </div>
    <script src="h.js"></script>
</body> 
</html>
